<title>Omertà</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F4F2ED; --card: #FFFFFF; --soft: #EFECE4; --line: #E3DFD5; --ink: #1C1B18; --muted: #6B675D;
  --green: #1E6B52; --green-soft: #DCEBE4; --on-green: #FFFFFF;
  --brass: #8A6218; --brass-soft: #F3E8CF;
  --red: #A8322A; --red-soft: #F5DEDB; --blue: #2C4A63; --blue-soft: #E4ECF2;
  --f0: #1F6F9C; --f1: #9A5A14; --f2: #6A4AA3; --f3: #2B7A5E; --f4: #A0364A; --fx: #6B675D;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171A; --card: #1C2126; --soft: #262C32; --line: #2E353C; --ink: #ECE8DE; --muted: #9AA3AB;
    --green: #5FB895; --green-soft: #1E3A31; --on-green: #0A1612; --brass: #D7B15F; --brass-soft: #3A3120;
    --red: #E5766D; --red-soft: #3D2321; --blue: #86B2D6; --blue-soft: #1F3040;
    --f0: #6FB8E0; --f1: #E0A56F; --f2: #B79BE0; --f3: #6FD0A8; --f4: #E58A9A; --fx: #9AA3AB; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171A; --card: #1C2126; --soft: #262C32; --line: #2E353C; --ink: #ECE8DE; --muted: #9AA3AB;
  --green: #5FB895; --green-soft: #1E3A31; --on-green: #0A1612; --brass: #D7B15F; --brass-soft: #3A3120;
  --red: #E5766D; --red-soft: #3D2321; --blue: #86B2D6; --blue-soft: #1F3040;
  --f0: #6FB8E0; --f1: #E0A56F; --f2: #B79BE0; --f3: #6FD0A8; --f4: #E58A9A; --fx: #9AA3AB; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
#app { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); padding-top: max(20px, env(safe-area-inset-top, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.muted { color: var(--muted); }
.hurt { color: var(--red); }
.good { color: var(--green); }
a.nm { color: var(--green); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; font-weight: 600; }
h2.sect { font: 700 20px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
h2.sect small { font: 500 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
h1.page { font: 800 34px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 6px 0 4px; }
.pad { padding: 4px 2px; }

/* status strip */
.strip { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.when { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.cash { font: 800 48px/1 var(--display); margin-top: 4px; }
.meter { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--muted); }
.meter .track { width: 96px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.meter b { font-size: 12px; font-weight: 600; }
.whoami { font-size: 13px; color: var(--muted); margin-top: 6px; }
.attrs { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.attrs b { color: var(--ink); font-weight: 600; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; display: block; width: 100%; text-align: left; }
.card h2 { font: 700 18px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.card.alert { border-color: var(--brass); background: var(--brass-soft); }
.callout { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; margin-top: 10px; }
.callout.bad { background: var(--red-soft); color: var(--red); }
.callout.info { background: var(--blue-soft); color: var(--blue); }

/* needs-you rows */
.timebar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 14px 0 4px; }
.timebar button { min-width: 0; overflow-wrap: anywhere; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; min-height: 54px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.timebar button b { font: 700 14px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.timebar button span { font-size: 11px; color: var(--muted); line-height: 1.2; }
.timebar button:active { background: var(--green-soft); }
.more { display: block; width: 100%; text-align: center; background: none; border: 0; color: var(--green); font-weight: 600; padding: 10px; min-height: 44px; }
a.story{font-size:.82em;white-space:nowrap;color:var(--accent,#7a1f1f)}
.need { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 8px 0; min-height: 44px; }
.need .dot { margin-top: 7px; flex: none; }
.need .t { font-weight: 600; }
.need .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green); display: inline-block; flex: none; }
.dot.green { background: var(--green); } .dot.amber { background: var(--brass); } .dot.red { background: var(--red); } .dot.dead { background: var(--muted); } .dot.blue { background: var(--blue); }

/* tiles */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.tile .t { font: 700 20px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.tile .s { font-size: 13px; color: var(--muted); line-height: 1.3; }
.tile.wide { grid-column: 1 / -1; }
.tile.hot { border-color: var(--green); }
.tile .live { font-size: 12px; font-weight: 600; color: var(--green); }

/* lists and options */
.list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 44px; display: block; width: 100%; }
.opt b { font-weight: 600; }
.opt.sel { border-color: var(--green); background: var(--green-soft); }
.opt.danger { border-color: var(--red); color: var(--red); }
.opt.hot { border-color: var(--red); }
.because { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 400; }
.kicker { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.jt { display: block; font-weight: 600; margin-top: 2px; }
.btn { display: block; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; font-weight: 600; margin: 10px 0; min-height: 44px; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.bad { border-color: var(--red); color: var(--red); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn:disabled { opacity: .45; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
.row2 .btn { margin: 0; }
.back { background: none; border: 0; color: var(--green); font-weight: 600; padding: 10px 0; min-height: 44px; display: flex; align-items: center; gap: 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 0 16px; min-height: 40px; font-weight: 600; font-size: 14px; }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.small { min-height: 34px; padding: 0 12px; font-size: 13px; }

/* chips */
.chip { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 8px; border: 1px solid currentColor; white-space: nowrap; }
.chip.f0 { color: var(--f0); } .chip.f1 { color: var(--f1); } .chip.f2 { color: var(--f2); } .chip.f3 { color: var(--f3); } .chip.f4 { color: var(--f4); } .chip.fx { color: var(--fx); }
.tag { font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); border-radius: 8px; padding: 4px 9px; display: inline-block; }
.tag.green { background: var(--green-soft); color: var(--green); } .tag.amber { background: var(--brass-soft); color: var(--brass); } .tag.red { background: var(--red-soft); color: var(--red); } .tag.blue { background: var(--blue-soft); color: var(--blue); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }

/* bars */
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }
.bar.brass i { background: var(--brass); } .bar.red i { background: var(--red); }
.stat { margin: 10px 0; }
.stat .l { display: flex; justify-content: space-between; font-size: 13px; }
.stat .l span { color: var(--muted); }
.rows { margin: 4px 0 0; padding: 0; list-style: none; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--soft); font-size: 14px; }
.rows li:last-child { border-bottom: 0; }
.rows li .v { font-weight: 600; text-align: right; }
.rows li .v.good { color: var(--green); } .rows li .v.bad { color: var(--red); } .rows li .v.warn { color: var(--brass); }

/* banners (expandable groups) */
.banner { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; overflow: hidden; }
.banner > button { all: unset; box-sizing: border-box; width: 100%; padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 44px; }
.banner .ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
.banner .ico.g { background: var(--green-soft); color: var(--green); } .banner .ico.a { background: var(--brass-soft); color: var(--brass); } .banner .ico.b { background: var(--blue-soft); color: var(--blue); } .banner .ico.r { background: var(--red-soft); color: var(--red); }
.banner .bt { flex: 1; } .banner .bt b { font-size: 16px; display: block; } .banner .bt span { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.chip2 { font: 600 12.5px var(--body); padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.chip2.good { background: var(--green-soft); color: var(--green); border-color: transparent; }
.chip2.bad { background: var(--red-soft); color: var(--red); border-color: transparent; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 42px; margin: 6px 0 10px; } .spark i { flex: 1; background: var(--green); opacity: .75; border-radius: 3px 3px 0 0; }
.cstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; } .cst { background: var(--soft); border-radius: 10px; padding: 8px 10px; } .cst b { display: block; font-size: 17px; } .cst span { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.crewt { width: 100%; border-collapse: collapse; font-size: 13px; } .crewt th { text-align: right; font: 600 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 0 6px 6px; } .crewt th:first-child, .crewt td:first-child { text-align: left; padding-left: 0; } .crewt td { text-align: right; padding: 7px 0 7px 6px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; } .crewt td small { display: block; font-size: 11px; color: var(--muted); text-align: left; }
.crit { color: var(--red); font-weight: 600; }
.guide { margin: 14px 0 4px; border-color: var(--brass); } .guide .gl { list-style: none; margin: 8px 0 12px; padding: 0; } .guide .gl li { padding: 5px 0; color: var(--dim); } .guide .gl li.ok { opacity: .55; text-decoration: line-through; } .guide .gl li.now { color: var(--fg); } .guide .gl .s { display: block; font-size: 13px; color: var(--dim); margin: 2px 0 0 18px; }
.ambcard { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: block; width: 100%; text-align: left; margin: 14px 0 4px; cursor: pointer; }
.ambcard .head { margin: 2px 0 10px; } .ambcard .head .k { display: block; font: 700 10.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--brass); } .ambcard .head b { font-size: 17px; }
.ambs { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.amb .at { display: block; font-size: 14px; margin-bottom: 4px; }
.bar { display: block; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.goal .bar { margin: 8px 0 4px; } .headgoal { border-left: 4px solid var(--brass); }
.way { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 8px 0; cursor: pointer; min-height: 64px; }
.way.run { border-left: 4px solid var(--green); }
.way.ok { }
.way.lock { background: transparent; border-style: dashed; }
.way.lock .ico { filter: grayscale(.7); opacity: .7; }
.way .ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
.way .ico.g { background: var(--green-soft); color: var(--green); } .way .ico.a { background: var(--brass-soft); color: var(--brass); } .way .ico.b { background: var(--blue-soft); color: var(--blue); } .way .ico.r { background: var(--red-soft); color: var(--red); }
.way .wt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.way .wt b { font-size: 16px; }
.way .wp { font-size: 13px; color: var(--ink); opacity: .85; }
.way .wl { font-size: 12.5px; color: var(--muted); }
.way .go { color: var(--muted); flex: none; }
.way:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.way b .wtag { display: inline-block; font: 700 10px var(--body); font-style: normal; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--green-soft); color: var(--green); margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
.way b .wtag.ok { background: var(--blue-soft); color: var(--blue); }
.way b .wtag.off { background: var(--soft); color: var(--muted); }
h3.sub { font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; }
.banner.live { border-left: 4px solid var(--green); }
.banner.avail { background: transparent; border: 1.5px dashed var(--line); }
.banner.avail .ico { filter: grayscale(.6); opacity: .85; }
.banner .pill { font-style: normal; font: 700 10px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--green-soft); color: var(--green); margin-left: 8px; vertical-align: 2px; }
.banner .pill.off { background: var(--soft); color: var(--muted); }
.banner.avail .opt { border-style: dashed; background: transparent; }
.banner .chev { transition: transform .15s; color: var(--muted); }
.banner.open .chev { transform: rotate(180deg); }
.banner .body { border-top: 1px solid var(--soft); padding: 4px 14px 8px; display: none; }
.banner.open .body { display: block; }
.banner .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--soft); padding: 11px 0; min-height: 44px; }
.banner .item:last-child { border-bottom: 0; }
.banner .item b { font-weight: 600; display: block; }
.banner .item span { font-size: 13px; color: var(--muted); }

/* people lists */
ul.people { list-style: none; margin: 8px 0; padding: 0; }
ul.people li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.rowbtn { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer; }
.why { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; } .why::before { content: 'Because \2192 '; opacity: .65; } .why.crit { color: var(--red); }
.sunman.light { border-left: 4px solid var(--red); } .sunhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px; } .sunline { margin: 6px 0 2px; font-size: 14px; } .sunbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .sunbtns .btn { flex: 1 1 140px; width: auto; margin: 0; } .note.done { border-left-color: var(--green, #3f8f5b); }
.src { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
ul.news { list-style: none; margin: 0; padding: 0; } ul.news li { padding: 6px 0; border-bottom: 1px solid var(--soft); font-size: 14px; } ul.news li:last-child { border-bottom: 0; }
ul.intel { list-style: none; padding: 0; margin: 8px 0; } ul.intel li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--soft); font-size: 14px; }
.stamp { font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.note { border-left: 3px solid var(--line); padding-left: 12px; font-size: 14px; margin: 10px 0; line-height: 1.45; }
.say { font-size: 15px; line-height: 1.5; margin: 8px 0; }

/* character header */
.pers { display: flex; gap: 14px; align-items: center; margin: 6px 0 4px; }
.avatar { width: 64px; height: 64px; border-radius: 32px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font: 800 28px var(--display); flex: none; }
.pers .chooser { display: flex; gap: 14px; align-items: flex-start; margin: 14px 0; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.chooser .pv .avatar.pt { width: 104px; height: 104px; border-radius: 52px; }
.chooser .cg { flex: 1; min-width: 0; }
.chooser .cl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
.chooser .sw, .chooser .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line); box-sizing: border-box; }
.swatch.on { border-color: var(--green); box-shadow: 0 0 0 2px var(--green-soft); }
.chooser .btn { margin-top: 12px; }
@media (max-width: 440px) { .chooser { flex-direction: column; align-items: center; } .chooser .cg { width: 100%; } }
.avatar.pt { width: 96px; height: 96px; border-radius: 48px; }
.avatar.pt { background: none; overflow: hidden; padding: 0; border: 2px solid var(--line); box-sizing: border-box; }
.avatar.f0 { background: var(--f0); color: #fff; } .avatar.f1 { background: var(--f1); color: #fff; } .avatar.f2 { background: var(--f2); color: #fff; } .avatar.f3 { background: var(--f3); color: #fff; } .avatar.f4 { background: var(--f4); color: #fff; } .avatar.fx { background: var(--fx); color: #fff; }
.pers h1 { font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.pers .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

/* family tree */
.card h2 small { float: right; font: 600 13px var(--body, inherit); letter-spacing: 0; text-transform: none; color: var(--muted); }
.tree { display: flex; flex-direction: column; align-items: center; margin: 12px 0; }
.node { box-sizing: border-box; width: 100%; min-height: 44px; border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.node .nn { flex: 1; min-width: 0; }
.node .nn a.nm { color: var(--ink); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .nn small { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.node.top { width: 210px; border-width: 1.5px; border-color: #CFC9BA; }
.node.you { background: var(--green-soft); border: 2px solid var(--green); }
.node.open { background: transparent; border: 1.5px dashed var(--muted); color: var(--muted); }
