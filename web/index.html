<title>Omertà</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturCook:wght@700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===================================================================== the game
   One dark identity from the V86 opening (--om-* tokens, defined below). The in-game palette is expressed in those terms;
   the old light/dark variants are gone: OMERTÀ is a night-time game. Class names are the ones the views already use. */
:root {
  --bg: #121110; --card: #1a1816; --soft: #221f1c; --raise: #26231f; --line: #2e2a26; --line-2: #3b3631;
  --ink: #ece3d1; --ink-2: #c8bea9; --muted: #a0978a; --dim: #7c7468; --fg: #ece3d1;
  --green: #8fb39a; --green-soft: rgba(143, 179, 154, .12); --on-green: #0e1410;
  --brass: #c9a466; --brass-2: #dcc08a; --brass-soft: rgba(185, 150, 92, .14);
  --wine: #6b1d27; --wine-2: #84283a; --wine-soft: rgba(132, 40, 58, .22);
  --red: #dd8378; --red-soft: rgba(208, 105, 93, .13); --blue: #93b2c9; --blue-soft: rgba(147, 178, 201, .12);
  --f0: #7fb0cf; --f1: #d3a06a; --f2: #b09ad6; --f3: #7fc0a3; --f4: #d68c9a; --fx: #a0978a;
  --accent: var(--brass-2);
  --display: "Cormorant Garamond", "Cormorant", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
::selection { background: var(--wine-2); color: #fff; }
.muted { color: var(--muted); }
.hurt { color: var(--red); }
.good { color: var(--green); }
a.nm { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(220, 192, 138, .35); font-weight: 500; }
a.nm:hover { border-bottom-color: var(--accent); }
h2.sect { font: 500 22px/1.2 var(--display); margin: 30px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--ink); }
h2.sect small { font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1.page { font: 500 34px/1.05 var(--display); margin: 8px 0 6px; }
h3.sub { font: 600 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); margin: 22px 0 6px; }
.pad { padding: 4px 2px; }
p { margin: 8px 0; }

/* blocks. A card is for things that belong together; most lists are rows, not boxes. */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin: 14px 0; display: block; width: 100%; text-align: left; }
.card h2 { font: 600 11px/1.3 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); margin: 0 0 10px; }
.card h2 small { float: right; font: 500 12px var(--body); letter-spacing: .02em; text-transform: none; color: var(--muted); }
.card p { margin: 6px 0; }
.card.alert { border-color: rgba(201, 164, 102, .5); background: linear-gradient(180deg, var(--brass-soft), transparent 70%), var(--card); }
.callout { background: var(--soft); border-left: 2px solid var(--line-2); border-radius: 2px; padding: 10px 14px; font-size: 14px; line-height: 1.45; margin: 12px 0; }
.callout.bad { background: var(--red-soft); border-left-color: var(--red); color: #f0c2bb; }
.callout.info { background: var(--blue-soft); border-left-color: var(--blue); color: #cfe0ec; }

/* time */
.timebar { display: flex; gap: 6px; margin: 14px 0 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.timebar::-webkit-scrollbar { display: none; }
.timebar button { flex: none; min-width: 0; background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; text-align: left; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 0; transition: border-color .15s, background .15s; }
.timebar button:hover { border-color: var(--brass); }
.timebar button b { font: 600 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.timebar button span { font-size: 11px; color: var(--muted); line-height: 1.25; white-space: nowrap; }
.timebar button:active { background: var(--brass-soft); }
.more { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--accent); font-weight: 500; padding: 10px 0; min-height: 44px; }
.more:hover { color: var(--ink); }
a.story { font-size: .82em; white-space: nowrap; color: var(--accent); }

/* matters: rows with a coloured mark */
.need { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 4px; margin: 0; min-height: 44px; transition: background .15s; }
.need:hover { background: rgba(255, 255, 255, .02); }
.need + :not(.need) { margin-top: 0; }
.need .dot { margin-top: 8px; flex: none; }
.need .t { font-weight: 500; color: var(--ink); }
.need .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; flex: none; }
.dot.green { background: var(--green); } .dot.amber { background: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft); } .dot.red { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); } .dot.dead { background: var(--dim); } .dot.blue { background: var(--blue); }

/* places and actions */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-height: 76px; display: flex; flex-direction: column; gap: 3px; transition: border-color .15s, background .15s; }
.tile:hover { border-color: rgba(201, 164, 102, .55); }
.tile .t { font: 500 19px/1.15 var(--display); color: var(--ink); }
.tile .s { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.tile.wide { grid-column: 1 / -1; }
.tile.hot { border-color: var(--brass); background: linear-gradient(180deg, var(--brass-soft), transparent), var(--card); }
.tile .live { font-size: 12px; font-weight: 600; color: var(--green); }

/* lists and options */
.list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.opt { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-height: 48px; display: block; width: 100%; transition: border-color .15s, background .15s; }
.opt:hover { border-color: rgba(201, 164, 102, .55); }
.opt b { font-weight: 500; }
.opt.sel { border-color: var(--brass); background: var(--brass-soft); }
.opt.danger { border-color: rgba(221, 131, 120, .6); color: var(--red); }
.opt.hot { border-color: var(--red); }
.because { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 400; }
.kicker { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.jt { display: block; font-weight: 500; margin-top: 2px; }
.btn { display: block; width: 100%; text-align: center; background: transparent; border: 1px solid var(--line-2); border-radius: var(--r); padding: 13px 16px; font: 600 12.5px var(--body); letter-spacing: .12em; text-transform: uppercase; margin: 10px 0; min-height: 48px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--wine); border-color: var(--wine-2); color: #f7f0e3; }
.btn.primary:hover { background: var(--wine-2); }
.btn.bad { border-color: rgba(221, 131, 120, .6); color: var(--red); }
.btn.danger { background: #7a2a24; border-color: #94362e; color: #fff; }
.btn:disabled { opacity: .4; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.row2 .btn { margin: 0; }
.back { background: none; border: 0; color: var(--ink-2); font-weight: 500; padding: 8px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.back:hover { color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 0 15px; min-height: 40px; font: 500 13.5px var(--body); color: var(--ink-2); }
.pill:hover { border-color: var(--brass); color: var(--ink); }
.pill.on { background: var(--brass-soft); color: var(--ink); border-color: var(--brass); }
.pill.small { min-height: 34px; padding: 0 12px; font-size: 13px; }

/* chips, tags, bars */
.chip { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.chip.f0 { color: var(--f0); } .chip.f1 { color: var(--f1); } .chip.f2 { color: var(--f2); } .chip.f3 { color: var(--f3); } .chip.f4 { color: var(--f4); } .chip.fx { color: var(--fx); }
.tag { font-size: 11.5px; font-weight: 600; background: var(--soft); color: var(--ink-2); border-radius: 2px; padding: 3px 8px; display: inline-block; }
.tag.green { background: var(--green-soft); color: var(--green); } .tag.amber { background: var(--brass-soft); color: var(--brass-2); } .tag.red { background: var(--red-soft); color: var(--red); } .tag.blue { background: var(--blue-soft); color: var(--blue); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--brass); }
.bar.brass i { background: var(--brass); } .bar.red i { background: var(--red); }
.stat { margin: 12px 0; }
.stat .l { display: flex; justify-content: space-between; font-size: 13px; }
.stat .l span { color: var(--muted); }
.rows { margin: 4px 0 0; padding: 0; list-style: none; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rows li:last-child { border-bottom: 0; }
.rows li .v { font-weight: 500; text-align: right; color: var(--ink); }
.rows li .v.good { color: var(--green); } .rows li .v.bad { color: var(--red); } .rows li .v.warn { color: var(--brass-2); }

/* banners (expandable groups) */
.banner { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin: 8px 0; overflow: hidden; }
.banner > button { all: unset; box-sizing: border-box; width: 100%; padding: 13px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 56px; }
.banner > button:focus-visible { outline: 2px solid var(--brass-2); outline-offset: -2px; }
.banner .ico { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; border: 1px solid currentColor; }
.banner .ico svg { width: 18px; height: 18px; }
.banner .ico.g { color: var(--green); } .banner .ico.a { color: var(--brass-2); } .banner .ico.b { color: var(--blue); } .banner .ico.r { color: var(--red); }
.banner .bt { flex: 1; min-width: 0; } .banner .bt b { font: 500 18px/1.2 var(--display); display: block; } .banner .bt span { font-size: 13px; color: var(--muted); }
.banner.live { border-left: 2px solid var(--brass); }
.banner.avail { background: transparent; border: 1px dashed var(--line-2); }
.banner.avail .ico { opacity: .7; }
.banner .pill { font: 600 9.5px var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; background: var(--brass-soft); color: var(--brass-2); border: 0; margin-left: 8px; vertical-align: 3px; min-height: 0; }
.banner .pill.off { background: var(--soft); color: var(--muted); }
.banner.avail .opt { border-style: dashed; background: transparent; }
.banner .chev { transition: transform .2s; color: var(--muted); flex: none; }
.banner.open .chev { transform: rotate(180deg); }
.banner .body { border-top: 1px solid var(--line); padding: 4px 14px 10px; display: none; }
.banner.open .body { display: block; animation: om-fade var(--om-mid) var(--om-ease) both; }
.banner .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 0; min-height: 44px; }
.banner .item:last-child { border-bottom: 0; }
.banner .item b { font-weight: 500; display: block; }
.banner .item span { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.chip2 { font: 500 12.5px var(--body); padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--ink-2); border: 1px solid var(--line); }
.chip2.good { background: var(--green-soft); color: var(--green); border-color: transparent; }
.chip2.bad { background: var(--red-soft); color: var(--red); border-color: transparent; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 42px; margin: 6px 0 10px; } .spark i { flex: 1; background: var(--brass); opacity: .7; border-radius: 1px 1px 0 0; }
.cstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; } .cst { background: var(--soft); border-radius: 2px; padding: 8px 10px; } .cst b { display: block; font: 500 20px var(--display); } .cst span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.crewt { width: 100%; border-collapse: collapse; font-size: 13px; } .crewt th { text-align: right; font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 2px 0 6px 6px; } .crewt th:first-child, .crewt td:first-child { text-align: left; padding-left: 0; } .crewt td { text-align: right; padding: 7px 0 7px 6px; border-top: 1px solid var(--line); }
.crit { color: var(--red); font-weight: 600; }

/* first week, ambitions, ways to earn */
.guide { border-color: rgba(201, 164, 102, .45); } .guide .gl { list-style: none; margin: 8px 0 4px; padding: 0; } .guide .gl li { padding: 5px 0; color: var(--dim); } .guide .gl li.ok { opacity: .55; text-decoration: line-through; } .guide .gl li.now { color: var(--fg); } .guide .gl .s { display: block; font-size: 13px; color: var(--muted); margin-left: 18px; }
.ambcard { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: block; width: 100%; text-align: left; margin: 14px 0 4px; cursor: pointer; }
.ambcard .head { margin: 2px 0 10px; } .ambcard .head .k { display: block; font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); } .ambcard .head b { font: 500 19px var(--display); }
.ambs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.amb .at { display: block; font-size: 14px; margin-bottom: 4px; }
.goal .bar { margin: 8px 0 4px; } .headgoal { border-left: 2px solid var(--brass); }
.way { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 6px 0; cursor: pointer; min-height: 64px; transition: border-color .15s; }
.way:hover { border-color: rgba(201, 164, 102, .55); }
.way.run { border-left: 2px solid var(--brass); }
.way.lock { background: transparent; border-style: dashed; }
.way.lock .ico { opacity: .6; }
.way .ico { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; border: 1px solid currentColor; }
.way .ico svg { width: 18px; height: 18px; }
.way .ico.g { color: var(--green); } .way .ico.a { color: var(--brass-2); } .way .ico.b { color: var(--blue); } .way .ico.r { color: var(--red); }
.way .wt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.way .wt b { font: 500 18px/1.2 var(--display); }
.way .wp { font-size: 13px; color: var(--ink-2); }
.way .wl { font-size: 12.5px; color: var(--muted); }
.way .go { color: var(--muted); flex: none; }
.way:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.way b .wtag { display: inline-block; font: 600 9.5px var(--body); font-style: normal; letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; background: var(--brass-soft); color: var(--brass-2); margin-left: 8px; vertical-align: 3px; white-space: nowrap; }
.way b .wtag.ok { background: var(--blue-soft); color: var(--blue); }
.way b .wtag.off { background: var(--soft); color: var(--muted); }

/* people and records */
ul.people { list-style: none; margin: 8px 0; padding: 0; }
ul.people li { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 12px 2px; margin: 0; }
.rowbtn { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer; }
.rowbtn:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.why { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; } .why::before { content: 'Because \2192 '; opacity: .65; } .why.crit { color: var(--red); }
.sunman.light { border-left: 2px solid var(--red); } .sunhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px; } .sunline { margin: 6px 0 2px; font-size: 14px; } .sunbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .sunbtns .btn { flex: 1 1 140px; margin: 0; }
.src { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
ul.news { list-style: none; margin: 0; padding: 0; } ul.news li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; } ul.news li:last-child { border-bottom: 0; }
ul.intel { list-style: none; padding: 0; margin: 8px 0; } ul.intel li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.stamp { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.note { border-left: 2px solid var(--line-2); padding-left: 12px; font-size: 14px; margin: 10px 0; line-height: 1.5; }
.say { font: 400 18px/1.5 var(--display); margin: 8px 0; color: var(--ink); }

/* a person */
.pers { display: flex; gap: 16px; align-items: center; margin: 8px 0 6px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--soft); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font: 500 26px var(--display); flex: none; }
.avatar.pt { width: 96px; height: 96px; background: #0b0a09; overflow: hidden; padding: 0; border: 1px solid var(--line-2); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px rgba(214, 185, 129, .28); }
.avatar.pt svg { display: block; }
.avatar.f0 { background: var(--f0); color: #fff; } .avatar.f1 { background: var(--f1); color: #fff; } .avatar.f2 { background: var(--f2); color: #fff; } .avatar.f3 { background: var(--f3); color: #fff; } .avatar.f4 { background: var(--f4); color: #fff; } .avatar.fx { background: var(--fx); color: #fff; }
.pers h1 { font: 500 32px/1.05 var(--display); margin: 0; }
.pers .sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.swatch { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line); box-sizing: border-box; }
.swatch.on { border-color: var(--brass-2); }

/* family tree */
.tree { display: flex; flex-direction: column; align-items: center; margin: 12px 0; }
.node { box-sizing: border-box; width: 100%; min-height: 44px; border-radius: var(--r); padding: 8px 10px; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.node .avatar.pt { width: 36px; height: 36px; box-shadow: none; }
.node .nn { flex: 1; min-width: 0; }
.node .nn a.nm { color: var(--ink); border: 0; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .nn small { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.node.top { width: 230px; border-color: rgba(201, 164, 102, .5); }
.node.you { background: var(--brass-soft); border: 1px solid var(--brass); }
.node.open { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
.node.faded { opacity: .5; }
.rows.q li { align-items: flex-start; gap: 10px; }
.rows.q li.you { background: var(--brass-soft); border-radius: 2px; padding: 8px; }
.qn { font-weight: 600; width: 18px; color: var(--muted); }
.qb { flex: 1; min-width: 0; display: block; }
.qb small { display: block; }
.qbar { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--brass); }
.mini { all: unset; cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-2); white-space: nowrap; }
.mini:hover { border-color: var(--brass); color: var(--ink); }
.node.sub3 { margin-left: 52px; width: calc(100% - 52px); min-height: 34px; border-left: 2px solid var(--line-2); font-size: 13.5px; }
.node.sub2 { margin-left: 34px; width: calc(100% - 34px); min-height: 36px; border-left: 2px solid rgba(201, 164, 102, .3); font-size: 14px; }
.org-lab { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px 4px; }
.node.sub { margin-left: 16px; width: calc(100% - 16px); min-height: 38px; }
.vline { width: 1px; height: 14px; background: var(--line-2); }
.crews { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; width: 100%; }
.crew { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: rgba(26, 24, 22, .6); }
.crew .hd { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; display: flex; justify-content: space-between; }

input[type=text] { width: 100%; font: inherit; padding: 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--soft); color: var(--ink); min-height: 44px; }
.small-note { font-size: 12px; color: var(--muted); }
.room { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 2px 0; margin: 10px 0; }
.room .who { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 48px; }
.room .who:last-child { border-bottom: 0; }
.room .who:hover { background: rgba(255, 255, 255, .02); }
.room .who b { font-weight: 500; } .room .who span { display: block; font-size: 13px; color: var(--muted); }
details.fold > summary { list-style: none; cursor: pointer; } details.fold > summary::-webkit-details-marker { display: none; }

/* conversation: his words in the book face, yours in the plain one, the room around you in italics */
.opt { position: relative; }
.opt.row { padding: 10px 14px; min-height: 44px; }
.opt.row b { font-weight: 400; }
.talk-now { margin: 14px 0 8px; }
.you-said { margin: 14px 0 8px auto; max-width: 86%; background: transparent; color: var(--ink-2); border: 0; border-right: 2px solid var(--line-2); border-radius: 0; padding: 2px 12px 2px 0; font-size: 14.5px; line-height: 1.45; width: fit-content; text-align: right; font-style: italic; }
.him { background: transparent; border: 0; border-left: 2px solid var(--brass); border-radius: 0; padding: 2px 0 2px 16px; margin: 10px 0 14px; }
.him p { margin: 8px 0; }
.him .say { font: 400 21px/1.42 var(--display); color: var(--ink); }
.him .nar { color: var(--muted); font-style: italic; font-size: 14.5px; }
.him .fx { color: var(--muted); font-size: 12.5px; margin-top: 10px; letter-spacing: .02em; }
.talk-hist { margin: 8px 0; font-size: 14px; color: var(--muted); }
.talk-hist summary { cursor: pointer; padding: 8px 0; list-style: none; font-weight: 500; color: var(--accent); }
.talk-hist summary::-webkit-details-marker { display: none; }
.talk-hist .him, .talk-hist .you-said { opacity: .6; }
.talk-hist .him .say { font-size: 17px; }
.opt.done { opacity: .38; filter: grayscale(1); cursor: default; }
.opt.done:hover { border-color: var(--line); }
.opt.nav { background: transparent; border-style: dashed; color: var(--muted); }
.opt.nav b { font-weight: 400; }
.opt.nav .because { display: inline; margin-left: 6px; }
.opt .sg { position: absolute; right: 12px; top: 13px; }
.sg { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-style: normal; font-weight: 700; font-size: 11px; line-height: 1; }
.sg.go { background: var(--brass); color: #2b1d03; }
.sg.end { background: var(--green); color: #0e1410; }
.opt.sg-go, .opt.sg-end { padding-right: 40px; }
/* ===================================================================== the frame (V88)
   Phone: slim status bar, one column, five tabs at the bottom. Desktop (900px and up): rail, screen, context column. */
body.g-on { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
#app { margin: 0 auto; }
.g-shell { max-width: 640px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.g-rail { display: none; }
.g-main { min-width: 0; }
.g-main > :first-child { margin-top: 14px; }
.g-top { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 12px; margin: 0 -16px; padding: max(10px, env(safe-area-inset-top, 0px)) 16px 10px; background: rgba(18, 17, 16, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.g-top__me { all: unset; cursor: pointer; flex: none; border-radius: 50%; }
.g-top__me:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.g-top .avatar.pt { width: 36px; height: 36px; box-shadow: none; }
.g-top__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.g-cash { font: 500 23px/1 var(--display); color: var(--ink); }
.g-when { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-top__heat { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 600 10px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.g-top__heat i, .g-heat i { display: block; width: 56px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--brass) var(--h), var(--line) var(--h)); }
.g-top__heat.hot, .g-heat.hot b { color: var(--red); }
.g-top__heat.hot i, .g-heat.hot i { background: linear-gradient(90deg, var(--red) var(--h), var(--line) var(--h)); }
.g-side { margin-top: 34px; padding-top: 4px; border-top: 1px solid var(--line); }
.g-side > :first-child { margin-top: 18px; }

/* the bottom tabs (phone) */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(15, 14, 13, .97); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; color: var(--muted); font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; position: relative; transition: color .15s; }
.tabs button .ti { display: block; }
.tabs button.on { color: var(--brass-2); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--brass); }
.tabs button:focus-visible { outline: 2px solid var(--brass-2); outline-offset: -4px; }
.badge { position: absolute; top: 7px; right: calc(50% - 22px); background: var(--wine-2); color: #fff; font: 700 10px var(--body); letter-spacing: 0; min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

/* the rail (desktop) */
.g-brand { font: 500 21px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 26px; padding-left: .16em; }
.g-me { all: unset; cursor: pointer; display: grid; grid-template-columns: 54px 1fr; column-gap: 12px; align-items: center; border-radius: 3px; }
.g-me:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 4px; }
.g-me .avatar.pt { width: 54px; height: 54px; grid-row: span 2; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px rgba(214, 185, 129, .3); }
.g-me__name { font: 500 20px/1.1 var(--display); color: var(--ink); align-self: end; }
.g-me__rank { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); align-self: start; margin-top: 3px; }
.g-status { margin: 22px 0 18px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.g-status__when { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; } .g-status__when span { color: var(--muted); }
.g-status__cash { font: 500 40px/1.05 var(--display); margin: 10px 0 4px; color: var(--ink); }
.g-status__carry { font-size: 12px; color: var(--brass-2); margin-bottom: 6px; }
.g-heat { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 6px; margin-top: 12px; font-size: 12.5px; }
.g-heat span { color: var(--muted); } .g-heat b { font-weight: 500; text-align: right; } .g-heat i { grid-column: 1 / -1; width: 100%; }
.g-words { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12.5px; margin: 14px 0 0; }
.g-words dt { color: var(--muted); } .g-words dd { margin: 0; text-align: right; color: var(--ink); text-transform: capitalize; }
.g-nav { display: flex; flex-direction: column; gap: 2px; }
.g-nav__item { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 3px; color: var(--ink-2); font-size: 14.5px; position: relative; transition: background .15s, color .15s; }
.g-nav__item:hover { background: var(--soft); color: var(--ink); }
.g-nav__item.on { background: var(--soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--brass); }
.g-nav__item .ti { color: var(--muted); } .g-nav__item.on .ti { color: var(--brass-2); }
.g-nav__item:focus-visible { outline: 2px solid var(--brass-2); outline-offset: -2px; }
.g-nav__item .badge { position: static; margin-left: auto; }
.g-save { all: unset; cursor: pointer; margin-top: auto; padding: 14px 12px 0; font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.g-save:hover { color: var(--ink); }

body.g-scene { padding-bottom: env(safe-area-inset-bottom, 0px); }
body.g-scene .tabs { display: none; }
@media (min-width: 900px) {
  body.g-on { padding-bottom: 0; }
  .tabs, .g-top { display: none; }
  .g-shell { max-width: 1360px; display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(280px, 340px); column-gap: 44px; padding: 0 36px 0 0; }
  .g-shell.g-noside { grid-template-columns: 250px minmax(0, 780px); }
  .g-rail { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 30px 22px 22px; border-right: 1px solid var(--line); background: #0f0e0d; }
  .g-main { padding: 26px 0 72px; }
  .g-main > :first-child { margin-top: 0; }
  .g-side { margin: 0; padding: 26px 0 72px; border: 0; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; align-self: start; scrollbar-width: thin; }
  .g-side > :first-child { margin-top: 0; }
}
@media (min-width: 1500px) { .g-shell { max-width: 1480px; } }

/* ===================================================================== Today (V88) */
.g-just { margin: 4px 0 6px; }
.g-just p { font: 400 19px/1.5 var(--display); color: var(--ink-2); margin: 0 0 10px; }
.g-just p:first-child { color: var(--ink); font-size: 21px; line-height: 1.42; }
.g-word { margin: 18px 0 4px; }
.g-word ul.news li { font-size: 14px; color: var(--ink-2); }
.g-pass { margin: 20px 0 6px; }

.g-rows { border-bottom: 1px solid var(--line); }

.g-links .more { width: auto; }

.g-career:hover { border-color: rgba(201, 164, 102, .55); }
.g-career p { margin: 4px 0; }

.track { display: block; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--brass); border-radius: 2px; }
.g-guide__step { font: 500 20px/1.25 var(--display); color: var(--ink); margin: 2px 0 2px; }
.g-guide__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; margin-top: 10px; }

.g-guide__acts details { flex: 1 1 100%; order: 3; }

/* V89 Today: what needs you. A man who has come to you has his face; anything else a quiet mark. */
.td-rows { margin: 0 0 4px; }
.td-row { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; width: 100%; padding: 13px 6px 14px 2px; border-top: 1px solid var(--line); transition: background .15s; }
.td-row:hover { background: rgba(255, 255, 255, .02); }
.td-row:focus-visible { outline: 1px solid var(--brass); outline-offset: -1px; }
.td-row > .st-mark { margin: 25px 5px 0 4px; }
.td-face { flex: none; margin-top: 2px; }
.td-face .avatar.pt { width: 44px; height: 44px; box-shadow: none; }
.td-face--red .avatar.pt { border-color: var(--red); }
.td-row__body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.td-row__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.td-row__top .st-origin:last-child:not(:first-child) { text-align: right; }
.td-name { font: 600 13px/1.4 var(--body); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-row__title { font: 500 19px/1.25 var(--display); color: var(--ink); margin-top: 2px; }
.td-row__sub { font-size: 13.5px; line-height: 1.45; color: var(--muted); margin-top: 2px; }
.td-heard { margin: 26px 0 4px; }
.td-heard__row { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 10px 2px 11px; border-top: 1px solid var(--line); }
.td-heard__row:hover { background: rgba(255, 255, 255, .02); }
.td-heard__row:focus-visible { outline: 1px solid var(--brass); outline-offset: -1px; }
.td-heard__text { display: block; font: italic 400 16.5px/1.45 var(--display); color: var(--ink-2); }
.td-heard__src { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; }
.td-heard__src b { font-weight: 500; color: var(--brass); white-space: nowrap; }
.way.compact { min-height: 54px; padding: 9px 12px; margin: 4px 0; }
.way.compact .ico { width: 30px; height: 30px; } .way.compact .ico svg { width: 15px; height: 15px; }
.way.compact .wt b { font-size: 17px; }
.g-locked .g-ways { opacity: .8; }
.crew > .hd { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-height: 32px; }
.crew > .hd span:last-child { display: inline-flex; align-items: center; gap: 4px; }
.crew > .hd .chev { transition: transform .2s; }
.crew.open > .hd .chev { transform: rotate(180deg); }
.crew > .hd:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.crew:not(.open) { gap: 4px; }
.g-famact { margin-top: 18px; }
.g-figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 16px 0; }
.g-fig { background: var(--card); padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.g-fig b { font: 500 18px/1.2 var(--display); color: var(--ink); text-transform: capitalize; overflow-wrap: anywhere; }
.g-fig span { font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.g-fig.warn b { color: var(--brass-2); }
.g-sheet { align-items: flex-start; }
.g-sheet .avatar.pt { width: 88px; height: 88px; }
.g-sheet__bg { font: italic 400 16px/1.45 var(--display); color: var(--ink-2); margin: 10px 0 0; }
.g-sheet__bg b { font-style: normal; font-weight: 600; color: var(--brass-2); }
.g-goal { border-top: 1px solid var(--line); }
.g-goal:last-of-type { border-bottom: 1px solid var(--line); }
.g-goal > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; padding: 14px 2px; }
.g-goal > summary::-webkit-details-marker { display: none; }
.g-goal > summary:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.g-goal__t { font: 500 18px/1.25 var(--display); color: var(--ink); }
.g-goal__n { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.g-goal .bar { grid-column: 1 / -1; margin: 0; }
.g-goal__body { padding: 0 2px 14px; font-size: 14px; }
.g-goal__body p { margin: 4px 0; }
.g-goal.headgoal { border-left: 0; }
.g-goal.headgoal .g-goal__t { color: var(--brass-2); }
.g-people { border-bottom: 1px solid var(--line); }
.g-person { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); }
.g-person .avatar.pt { width: 48px; height: 48px; box-shadow: none; }
.g-person__t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.g-person__t span { font-size: 12.5px; color: var(--muted); }

.g-meet { margin-bottom: 6px; }

.g-table { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.g-table::-webkit-scrollbar { display: none; }
.g-seat { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.g-seat .avatar.pt { width: 52px; height: 52px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px rgba(214, 185, 129, .25); }
.g-seat span { font: 500 15px/1.1 var(--display); color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sunbtns .btn { flex: 0 1 auto; width: auto; min-height: 40px; padding: 8px 14px; font: 500 13.5px var(--body); letter-spacing: 0; text-transform: none; }
.sunmore { margin-top: 2px; }
.sunmore .sunbtns { margin-top: 2px; }
.g-meet .g-just span { font: 400 17px/1.5 var(--display); color: var(--ink-2); }
@media (min-width: 900px) {
  .g-figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-sheet .avatar.pt { width: 120px; height: 120px; }
  .crews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 12px; }
  .g-ways { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 8px; }
  .g-places { grid-template-columns: repeat(3, minmax(0, 1fr)); }

}

/* ===================================================================== the Herald (V88): a 1970 front page */
.herald__issues { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 12px; font-size: 12px; color: var(--muted); }
.herald__issues .mini:disabled { opacity: .3; cursor: default; }
.herald { --np-ink: #1c1914; --np-rule: #2b251c; position: relative; color: var(--np-ink); padding: 16px 15px 16px; border-radius: 1px;
  background: linear-gradient(180deg, rgba(255, 251, 236, .45), rgba(130, 100, 50, .12)), url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"), #e7dfca;
  box-shadow: 0 26px 50px -26px #000, 0 0 0 1px rgba(0, 0, 0, .5); font-family: "Old Standard TT", Georgia, "Times New Roman", serif; }

.herald__ears span { border: 1px solid var(--np-rule); padding: 3px 6px; }
.herald__name { font: 700 clamp(29px, 9.2vw, 60px)/1.05 "UnifrakturCook", "Old English Text MT", "Old Standard TT", Georgia, serif; margin: 4px 0 6px; color: var(--np-ink); }

@media (min-width: 560px) { .herald { padding: 24px 30px 22px; } .herald__cols { columns: 2; } .herald__ears { font-size: 9.5px; } }

/* ===================================================================== V86 design foundations
   The dark identity. Everything is namespaced .om / --om-* so screens move over one at a time;
   the opening (title + making the man) is the first to use it. */
:root {
  /* colour: charcoal grounds, warm ivory type, aged brass for focus and selection, wine for the one decisive action */
  --om-black: #0b0a09; --om-bg: #121110; --om-surface: #1a1816; --om-surface-2: #221f1c; --om-surface-3: #2c2824;
  --om-line: rgba(236, 226, 206, .09); --om-line-2: rgba(236, 226, 206, .18);
  --om-ivory: #ece3d1; --om-ivory-2: #c4b9a5; --om-ivory-3: #979080;
  --om-brass: #b9965c; --om-brass-2: #d6b981; --om-brass-soft: rgba(185, 150, 92, .14);
  --om-wine: #6b1d27; --om-wine-2: #84283a; --om-wine-soft: rgba(132, 40, 58, .24);
  --om-danger: #d0695d;
  /* type: a book face for anything that is told, a plain sans for anything that is pressed */
  --om-serif: "Cormorant Garamond", "Cormorant", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --om-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --om-track: .18em;
  /* space, shape, motion */
  --om-1: 4px; --om-2: 8px; --om-3: 12px; --om-4: 16px; --om-5: 24px; --om-6: 32px; --om-7: 48px; --om-8: 72px;
  --om-radius: 3px; --om-tap: 44px;
  --om-ease: cubic-bezier(.2, .7, .2, 1); --om-fast: 160ms; --om-mid: 320ms;
}
body.om-open { background: var(--om-bg); color: var(--om-ivory); color-scheme: dark; padding-bottom: 0; }
body.om-open #app { max-width: none; padding: 0; }
.om { position: relative; min-height: 100vh; min-height: 100svh; font-family: var(--om-sans); color: var(--om-ivory); -webkit-tap-highlight-color: transparent;
  background: radial-gradient(110% 60% at 50% -8%, rgba(185, 150, 92, .09), transparent 62%), radial-gradient(130% 90% at 50% 115%, rgba(0, 0, 0, .6), transparent 60%), var(--om-bg);
  padding: max(var(--om-4), env(safe-area-inset-top, 0px)) max(var(--om-4), env(safe-area-inset-right, 0px)) 0 max(var(--om-4), env(safe-area-inset-left, 0px)); }
.om::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .045; background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .93  0 0 0 0 .88  0 0 0 0 .78  0 0 0 .6 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); z-index: 0; }
.om > * { position: relative; z-index: 1; }
.om :focus-visible { outline: 2px solid var(--om-brass-2); outline-offset: 3px; }
:where(.om) button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; cursor: pointer; }
:where(.om) p { margin: 0; }

/* type */
.om-eyebrow { font: 600 11px/1.3 var(--om-sans); letter-spacing: var(--om-track); text-transform: uppercase; color: var(--om-brass); }
.om-wordmark { font: 500 clamp(58px, 17vw, 116px)/.92 var(--om-serif); letter-spacing: .07em; text-transform: uppercase; margin: var(--om-4) 0 0; padding-left: .07em; color: var(--om-ivory); }
.om-rule { width: 40px; height: 1px; background: var(--om-brass); margin: var(--om-5) auto; opacity: .85; }

/* buttons */
.om-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--om-2); min-height: 52px; padding: 0 var(--om-5); border: 1px solid var(--om-line-2); border-radius: var(--om-radius); background: transparent; color: var(--om-ivory);
  font: 600 13px/1 var(--om-sans); letter-spacing: .16em; text-transform: uppercase; transition: background var(--om-fast), border-color var(--om-fast), color var(--om-fast), transform var(--om-fast); }
.om-btn:hover { border-color: var(--om-brass); }
.om-btn:active { transform: translateY(1px); }
.om-btn--primary { background: var(--om-wine); border-color: var(--om-wine-2); color: #f7f0e3; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 12px 32px -14px rgba(107, 29, 39, .9); }
.om-btn--primary:hover { background: var(--om-wine-2); border-color: #a03a4d; }
.om-btn--quiet { color: var(--om-ivory-2); }
.om-btn--ghost { border-color: transparent; padding: 0 var(--om-3); color: var(--om-ivory-2); letter-spacing: .12em; }
.om-btn--ghost:hover { border-color: transparent; color: var(--om-ivory); background: var(--om-surface-2); }
.om-btn--danger { border-color: rgba(208, 105, 93, .5); color: #eba79d; }
.om-btn--danger:hover { border-color: var(--om-danger); background: rgba(208, 105, 93, .08); }
.om-btn--sm { min-height: var(--om-tap); font-size: 12px; }
.om-btn--wide { width: 100%; }
.om-icon-btn { flex: none; width: var(--om-tap); height: var(--om-tap); display: grid; place-items: center; border: 0; border-radius: var(--om-radius); background: transparent; color: var(--om-brass); transition: background var(--om-fast), color var(--om-fast); }
.om-icon-btn:hover { background: var(--om-surface-2); color: var(--om-brass-2); }
.om-ico { flex: none; transition: transform var(--om-mid) var(--om-ease); }
.om-icon-btn:active .om-ico, .om-btn--ghost:active .om-ico { transform: rotate(90deg); }
.om-link { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: var(--om-tap); padding: 0 var(--om-2) 0 0; border: 0; background: none; color: var(--om-ivory-2); font: 500 14px var(--om-sans); }
.om-link:hover { color: var(--om-ivory); }
.om-next { display: inline-flex; align-items: center; gap: var(--om-2); min-height: var(--om-tap); padding: 0 var(--om-1); border: 0; background: none; color: var(--om-brass-2); font: 600 12px var(--om-sans); letter-spacing: .14em; text-transform: uppercase; }
.om-next span { color: var(--om-ivory-3); }
.om-next:hover .om-ico { transform: translateX(3px); }

/* selection: chips, swatches and rows share one language - brass edge, warm fill */
.om-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.om-chip { min-height: var(--om-tap); padding: 0 14px; border: 1px solid var(--om-line-2); border-radius: var(--om-radius); background: transparent; color: var(--om-ivory-2); font: 500 14px var(--om-sans); transition: background var(--om-fast), border-color var(--om-fast), color var(--om-fast); }
.om-chip:hover { border-color: rgba(185, 150, 92, .6); color: var(--om-ivory); }
.om-chip[aria-checked="true"] { background: var(--om-brass-soft); border-color: var(--om-brass); color: var(--om-ivory); }
.om-subtabs { display: flex; gap: 6px; margin: 0 0 6px; }
.om-subtabs .om-chip { flex: 1; min-height: 40px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.om-subtabs .om-chip[aria-selected="true"] { background: var(--om-brass-soft); border-color: var(--om-brass); color: var(--om-ivory); }
.om-swatches { display: flex; flex-wrap: wrap; gap: 2px; margin: -4px 0 6px -6px; }
.om-swatch { width: var(--om-tap); height: var(--om-tap); padding: 0; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
.om-swatch i { width: 30px; height: 30px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 1px var(--om-line-2); transition: box-shadow var(--om-fast), transform var(--om-fast); }
.om-swatch:hover i { transform: scale(1.06); }
.om-swatch[aria-checked="true"] i { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 3px var(--om-bg), 0 0 0 4.5px var(--om-brass-2); }
.om-choices { border-top: 1px solid var(--om-line); }
.om-choice { position: relative; display: block; width: 100%; min-height: 56px; padding: 14px 16px 14px 20px; border: 0; border-bottom: 1px solid var(--om-line); background: none; text-align: left; color: var(--om-ivory-2); transition: background var(--om-fast), color var(--om-fast); }
.om-choice::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; background: transparent; transition: background var(--om-fast); }
.om-choice:hover { background: var(--om-surface); color: var(--om-ivory); }
.om-choice[aria-checked="true"] { background: linear-gradient(90deg, var(--om-wine-soft), transparent 85%); color: var(--om-ivory); }
.om-choice[aria-checked="true"]::before { background: var(--om-brass); }
.om-choice__top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--om-3); }
.om-choice__label { font: 500 22px/1.15 var(--om-serif); }
.om-choice__skills { flex: none; font: 600 11px var(--om-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--om-ivory-3); }
.om-choice__more { display: none; }
.om-choice__blurb { display: block; margin-top: 8px; max-width: 48ch; font: italic 400 18px/1.45 var(--om-serif); color: var(--om-ivory-2); }
.om-choice__life { display: grid; grid-template-columns: auto 1fr; column-gap: var(--om-4); row-gap: 4px; margin-top: var(--om-3); padding-top: var(--om-3); border-top: 1px solid var(--om-line); font: 400 14px/1.45 var(--om-sans); }
.om-choice__head { grid-column: 1; font: 600 10.5px/1.9 var(--om-sans); letter-spacing: var(--om-track); text-transform: uppercase; color: var(--om-brass); }
.om-choice__item { grid-column: 2; color: var(--om-ivory); }
.om-choice__head + .om-choice__item { grid-row: auto; }
.om-choice__item + .om-choice__head { margin-top: 6px; }
.om-choice__item + .om-choice__head + .om-choice__item { margin-top: 6px; }
.om-choice[aria-checked="true"] .om-choice__more { display: block; animation: om-fade var(--om-mid) var(--om-ease) both; }
.om-choice[aria-checked="true"] .om-choice__skills { color: var(--om-brass-2); }
@media (max-width: 400px) { .om-choice__life { grid-template-columns: 1fr; } .om-choice__head, .om-choice__item { grid-column: 1; } }

/* fields */
.om-field + .om-field { margin-top: var(--om-4); }
.om-field__label { display: block; margin-bottom: 2px; font: 600 11px var(--om-sans); letter-spacing: var(--om-track); text-transform: uppercase; color: var(--om-ivory-3); }
.om-field__row { display: flex; align-items: center; gap: var(--om-2); border-bottom: 1px solid var(--om-line-2); transition: border-color var(--om-fast), box-shadow var(--om-fast); }
.om-field__row:focus-within { border-color: var(--om-brass); box-shadow: 0 1px 0 var(--om-brass); }
.om .om-input { flex: 1; min-width: 0; width: auto; min-height: 52px; padding: 6px 0; border: 0; border-radius: 0; background: transparent; color: var(--om-ivory); font: 500 30px/1.15 var(--om-serif); caret-color: var(--om-brass-2); }
.om .om-input:focus-visible { outline: none; }

/* panels and structure */
.om-panel__intro { font: italic 400 19px/1.4 var(--om-serif); color: var(--om-ivory-2); margin-bottom: var(--om-4); }
.om-panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--om-3); margin-bottom: var(--om-2); }
.om-panel__head .om-panel__intro { margin-bottom: 0; }
.om-group { padding: var(--om-3) 0 var(--om-2); border-top: 1px solid var(--om-line); }
.om-group__label { margin-bottom: var(--om-2); font: 600 11px var(--om-sans); letter-spacing: var(--om-track); text-transform: uppercase; color: var(--om-ivory-3); }
.om-grid2 { display: grid; grid-template-columns: 1fr; }
.om-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--om-3); margin-top: var(--om-5); }
.om-row--split { justify-content: space-between; }
.om-row--end { justify-content: flex-end; }
.om-notice { margin: var(--om-4) 0; padding: 12px 14px; border: 1px solid rgba(208, 105, 93, .35); border-radius: var(--om-radius); background: rgba(208, 105, 93, .1); color: #efb8b0; font-size: 14px; line-height: 1.45; text-align: left; }
.om-fade { animation: om-fade var(--om-mid) var(--om-ease) both; }
@keyframes om-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes om-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes om-draw { from { opacity: 0; transform: scaleX(0); } to { opacity: .85; transform: none; } }

/* ------------------------------------------------ title */
.om-title { display: flex; flex-direction: column; justify-content: center; text-align: center; }
.om-title__inner { width: 100%; max-width: 34rem; margin: 0 auto; padding: var(--om-7) 0 max(var(--om-6), env(safe-area-inset-bottom, 0px)); }
.om-prologue { max-width: 31ch; margin: 0 auto; display: grid; gap: var(--om-3); font: 400 21px/1.45 var(--om-serif); color: var(--om-ivory-2); }
.om-prologue__lead { font-style: italic; font-size: 27px; line-height: 1.25; color: var(--om-ivory); margin-bottom: var(--om-1); }
.om-prologue__close { font-style: italic; color: var(--om-ivory); }
.om-actions { display: grid; gap: var(--om-3); width: 100%; max-width: 420px; margin: var(--om-7) auto 0; text-align: left; }
.om-footnote { margin-top: var(--om-5); font-size: 13px; line-height: 1.5; color: var(--om-ivory-3); }
.om-continue { display: flex; align-items: center; gap: var(--om-4); width: 100%; padding: var(--om-3) var(--om-4) var(--om-3) var(--om-3); border: 1px solid var(--om-line-2); border-left: 2px solid var(--om-brass); border-radius: var(--om-radius); background: var(--om-surface); text-align: left; transition: background var(--om-fast), border-color var(--om-fast); }
.om-continue:hover { background: var(--om-surface-2); border-color: var(--om-brass); }
.om-continue__portrait { flex: none; width: 68px; height: 68px; overflow: hidden; border-radius: 2px; background: var(--om-black); }
.om-continue__portrait svg { display: block; }
.om-continue__text { flex: 1; min-width: 0; display: grid; gap: 3px; }
.om-continue__name { font: 500 25px/1.1 var(--om-serif); color: var(--om-ivory); overflow-wrap: anywhere; }
.om-continue__meta { font-size: 13px; line-height: 1.35; color: var(--om-ivory-2); }
.om-continue__meta + .om-continue__meta { color: var(--om-ivory-3); }
.om-continue__go { flex: none; color: var(--om-brass-2); transition: transform var(--om-fast); }
.om-continue:hover .om-continue__go { transform: translateX(3px); }
.om-confirm { padding: var(--om-4); border: 1px solid var(--om-line-2); border-left: 2px solid var(--om-danger); border-radius: var(--om-radius); background: var(--om-surface); }
.om-confirm p { font-size: 15px; line-height: 1.5; color: var(--om-ivory-2); }
.om-confirm b { color: var(--om-ivory); font-weight: 600; }
.om-confirm .om-row { margin-top: var(--om-4); }
.om-confirm .om-btn { flex: 1 1 140px; padding: 0 var(--om-3); }
.om-enter .om-s1, .om-enter .om-s2, .om-enter .om-s3, .om-enter .om-s4, .om-enter .om-s5, .om-enter .om-s6 { animation: om-rise .8s var(--om-ease) both; }
.om-enter .om-rule.om-s2 { animation-name: om-draw; }
.om-enter .om-s2 { animation-delay: .1s; } .om-enter .om-s3 { animation-delay: .35s; } .om-enter .om-s4 { animation-delay: .55s; } .om-enter .om-s5 { animation-delay: .75s; } .om-enter .om-s6 { animation-delay: .95s; }

/* ------------------------------------------------ making the man */
.om-create { display: flex; flex-direction: column; background: var(--om-bg); }
.om-create::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(130% 90% at 50% 115%, rgba(0, 0, 0, .55), transparent 60%); }
.om-bar, .om-create__grid, .om-dock { width: 100%; max-width: 560px; margin-left: auto; margin-right: auto; }
.om-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.om-create__grid { flex: 1; }
.om-hero { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: min(38vw, 176px) 1fr; gap: var(--om-4); align-items: end; padding: var(--om-3) 0 var(--om-5); background: linear-gradient(var(--om-bg) 82%, rgba(18, 17, 16, 0)); }
.om-portrait { position: relative; margin: 0; aspect-ratio: 1; padding: 5px; background: var(--om-black); border: 1px solid var(--om-line-2); box-shadow: 0 24px 40px -24px #000; }
.om-portrait::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(214, 185, 129, .22); pointer-events: none; }
.om-portrait svg { display: block; width: 100%; height: 100%; }
.om-identity { min-width: 0; padding-bottom: 2px; }
.om-name { margin: var(--om-2) 0 0; font: 500 clamp(28px, 7.6vw, 40px)/1.02 var(--om-serif); color: var(--om-ivory); }
.om-identity { container-type: inline-size; }
/* A name never breaks inside a word: it shrinks to fit its column (--n is its length in letters). */
.om-name span { display: block; white-space: nowrap; font-size: min(1em, calc(100cqi / (var(--n, 8) * .5))); }
.om-name span:first-child { font-style: italic; font-weight: 400; font-size: min(.78em, calc(100cqi / (var(--n, 8) * .46))); color: var(--om-ivory-2); }
.om-identity__bg { margin-top: var(--om-2); font: italic 500 17px/1.2 var(--om-serif); color: var(--om-brass-2); }
.om-seg { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: var(--om-5); border-bottom: 1px solid var(--om-line); }
.om-seg__tab { position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 2px; border: 0; background: none; color: var(--om-ivory-3); font: 600 12px var(--om-sans); letter-spacing: .1em; text-transform: uppercase; transition: color var(--om-fast); }
.om-seg__tab i { font: italic 500 15px var(--om-serif); letter-spacing: 0; text-transform: none; color: var(--om-brass); }
.om-seg__tab:hover { color: var(--om-ivory-2); }
.om-seg__tab[aria-selected="true"] { color: var(--om-ivory); }
.om-seg__tab[aria-selected="true"]::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: -1px; height: 2px; background: var(--om-brass); }
.om-dock { position: sticky; bottom: 0; z-index: 3; margin-top: var(--om-5); padding: var(--om-5) 0 max(var(--om-4), env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(18, 17, 16, 0), var(--om-bg) 34%); }
.om-dock__warn { margin-bottom: var(--om-2); text-align: center; font-size: 13px; color: var(--om-ivory-3); }
@media (max-width: 359px) { .om-seg__tab i { display: none; } .om-seg__tab { letter-spacing: .06em; } }
@media (max-width: 420px) { .om-next span { display: none; } }
@media (min-width: 440px) { .om-grid2 { grid-template-columns: 1fr 1fr; column-gap: var(--om-5); } }
@media (min-width: 900px) {
  .om { padding-top: max(var(--om-6), env(safe-area-inset-top, 0px)); }
  .om-bar, .om-create__grid, .om-dock { max-width: 1040px; }
  .om-create__grid { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; column-gap: 72px; align-items: start; margin-top: var(--om-6); }
  .om-hero { top: var(--om-6); grid-template-columns: 1fr; align-items: start; gap: var(--om-5); padding: 0; background: none; }
  .om-name { font-size: 50px; }
  .om-builder { padding-top: var(--om-1); }
  .om-dock { position: static; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; column-gap: 72px; background: none; padding-bottom: var(--om-7); }
  .om-dock > * { grid-column: 2; }
  .om-dock__warn { text-align: left; }
  .om-prologue { font-size: 23px; }
