# Typecheck, build and run every regression suite on each push and pull request.
# Free for public repositories on GitHub-hosted runners. The tests (Vitest) run in three parallel jobs of roughly equal work,
# so the wall-clock time is that of one job; failures are annotated on the pull request. Coverage is not measured here (it
# slows every test by about a quarter); run `make test-cov` locally to check the thresholds. See docs/05-testing.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make all
      - name: Committed build matches the source
        # The build is deterministic, so a rebuild of an up-to-date tree changes nothing.
        run: |
          if ! git diff --quiet -- dist/omerta.html; then
            echo "::warning file=dist/omerta.html::dist/omerta.html is stale - run 'make pages' and commit before deploying"
          fi
          if ! cmp -s dist/omerta.html index.html; then
            echo "::warning file=index.html::index.html differs from the build - run 'make pages' before deploying"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-html
          path: dist/omerta.html
          retention-days: 14

  suite:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split by work, not by meaning: situations/ is the most simulation, and the determinism suite builds ten worlds in
          # child processes. Everything else runs in the third job, including any new test file: Vitest finds the files,
          # nothing here lists them.
          - { name: situations, files: src/tests/situations }
          - { name: determinism, files: src/tests/determinism.test.ts }
          - { name: other tests, files: "--exclude 'src/tests/situations/**' --exclude src/tests/determinism.test.ts" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --maxWorkers=100%: Vitest leaves one core idle by default, a quarter of a 4-core runner.
      - run: npx vitest run ${{ matrix.files }} --maxWorkers=100%
