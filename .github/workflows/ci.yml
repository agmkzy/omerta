# Typecheck, build and run every regression suite on each push and pull request.
# Free for public repositories on GitHub-hosted runners. The suites (Vitest) run in parallel jobs, so the wall-clock time is
# roughly that of the slowest suite, v75. Each job writes a blob report with its coverage; the last job merges them into one
# report and checks the coverage thresholds in vitest.config.ts. See docs/05-testing.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make all
      - name: Committed build matches the source
        # The build is deterministic, so a rebuild of an up-to-date tree changes nothing.
        run: |
          if ! git diff --quiet -- dist/omerta.html; then
            echo "::warning file=dist/omerta.html::dist/omerta.html is stale - run 'make pages' and commit before deploying"
          fi
          if ! cmp -s dist/omerta.html index.html; then
            echo "::warning file=index.html::index.html differs from the build - run 'make pages' before deploying"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-html
          path: dist/omerta.html
          retention-days: 14

  suite:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # v75 and v74 are the slowest suites, so each gets a runner of its own. Every other suite runs in the third job,
          # including any new src/tests/*.test.ts: Vitest finds the files, nothing here lists them.
          - { name: v75 situations, id: v75, files: src/tests/v75.test.ts }
          - { name: v74 NPC agency, id: v74, files: src/tests/v74.test.ts }
          - { name: other suites, id: rest, files: --exclude src/tests/v74.test.ts --exclude src/tests/v75.test.ts }
    env:
      COMPAT: 1 # the schema-migration checks run in their suite's job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Coverage of a part is partial, so its thresholds are checked only on the merged report (job `report`).
      - run: npx vitest run ${{ matrix.files }} --coverage --coverage.thresholds=false --reporter=default --reporter=blob --outputFile.blob=blob-reports/${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.id }}
          path: blob-reports/
          retention-days: 1

  report:
    name: All suites and coverage
    needs: suite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: blob-reports
          merge-multiple: true
      # Fails if any suite failed, or if coverage of src/ fell below the thresholds.
      - run: npx vitest run --merge-reports=blob-reports --coverage
